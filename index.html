:root{--navy:#142943;--teal:#0a807e;--bg:#f3f7fb;--ink:#1d3048;--line:#dbe4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#122e4c,#096f79);color:white;padding:24px 20px}header .wrap{max-width:1000px;margin:auto}header h1{margin:5px 0;font-size:clamp(1.7rem,4vw,2.6rem)}header p{opacity:.91;margin:6px 0}main{max-width:1000px;margin:24px auto;padding:0 16px 60px}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.muted{color:#586b80;font-size:.92rem}.pill{background:#e1f3f1;color:#006966;border-radius:99px;padding:6px 12px;font-weight:650;font-size:.82rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 4px 16px #17334b0a}.card h3{margin:6px 0 9px}.card p{color:#53667b;line-height:1.5}.tag{font-size:.74rem;color:#086c70;text-transform:uppercase;letter-spacing:.06em;font-weight:800}button{cursor:pointer;font:inherit}button.primary{background:var(--teal);color:white;border:0;border-radius:11px;padding:11px 17px;font-weight:700}button.ghost{background:white;color:var(--navy);border:1px solid #b7c8d8;border-radius:11px;padding:10px 14px}button:focus-visible,input:focus-visible{outline:3px solid #e9ac2c;outline-offset:2px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.option{display:block;width:100%;text-align:left;background:#f9fbfe;border:1px solid #d6e1ec;border-radius:11px;padding:13px;margin:9px 0;color:var(--ink)}.option:hover:not(:disabled){border-color:var(--teal)}.option.selected{border:2px solid var(--teal);background:#e9f6f5}.option:disabled{cursor:default}.correct{border-color:#25845a!important;background:#eaf7f0!important}.wrong{border-color:#b35a53!important;background:#fff0ee!important}.feedback{padding:14px;border-radius:11px;margin-top:12px;background:#edf5fb;line-height:1.55}.feedback.good{background:#e8f7ef}.passage{line-height:1.85;background:#f6f9fc;border-left:4px solid #14a3a0;padding:20px;border-radius:9px;white-space:pre-line}.rule{background:#f1f8fa;border-left:4px solid #14a3a0;padding:15px;border-radius:9px;line-height:1.65}.progress{height:10px;background:#e6edf4;border-radius:9px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:var(--teal);transition:width .2s}h2{margin:8px 0 16px}h3{margin:8px 0}.small{font-size:.86rem}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.result{background:#f4f9fc;border-radius:12px;padding:14px}.result strong{font-size:1.4rem}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.filters button{border:1px solid #bdcedc;border-radius:99px;padding:8px 13px;background:white}.filters button.active{background:#0c7079;color:white;border-color:#0c7079}input{padding:10px;border-radius:9px;border:1px solid #bacbdc;max-width:100%}footer{text-align:center;color:#718095;font-size:.8rem;padding:20px} @media print{header,.buttons,.filters,.no-print{display:none!important}main{margin:0;max-width:none}.panel{box-shadow:none}} </style></head><body>

<script>const DATA={"grammar": [{"title": "Present Simple", "group": "Foundations", "rule": "Use the base verb (add -s/-es for he, she, it) for habits and facts. Negatives: do/does not + base verb.", "example": "She studies every evening.", "questions": [{"q": "Mariam ___ English every day.", "options": ["study", "studies", "studying"], "answer": 1, "why": "A singular third-person subject takes -s."}, {"q": "Which sentence expresses a habit?", "options": ["She is reading now.", "She reads before bed.", "She read yesterday."], "answer": 1, "why": "Present simple describes repeated routines."}, {"q": "They ___ live in the dormitory.", "options": ["does not", "do not", "not"], "answer": 1, "why": "Use do not with they."}, {"q": "___ your friend enjoy science?", "options": ["Do", "Does", "Is"], "answer": 1, "why": "Does introduces present-simple questions with a singular subject."}]}, {"title": "Past Simple", "group": "Foundations", "rule": "Use verb-ed or an irregular past form for completed past events. Questions use did + base verb.", "example": "We visited the university last week.", "questions": [{"q": "We ___ a campus yesterday.", "options": ["visit", "visited", "visiting"], "answer": 1, "why": "Yesterday signals a completed past action."}, {"q": "She ___ to the library last night.", "options": ["go", "went", "gone"], "answer": 1, "why": "Went is the past of go."}, {"q": "___ they finish the project?", "options": ["Did", "Do", "Have"], "answer": 0, "why": "Past simple questions begin with did."}, {"q": "He did not ___ the bus.", "options": ["missed", "miss", "missing"], "answer": 1, "why": "After did not, use the base verb."}]}, {"title": "Present Continuous", "group": "Foundations", "rule": "Use am/is/are + verb-ing for actions happening now or temporary situations.", "example": "They are preparing a presentation now.", "questions": [{"q": "Listen! It ___ outside.", "options": ["rains", "is raining", "rained"], "answer": 1, "why": "Listen! suggests an action in progress."}, {"q": "She ___ her essay at the moment.", "options": ["is writing", "writes", "wrote"], "answer": 0, "why": "At the moment points to present continuous."}, {"q": "Which is correctly formed?", "options": ["They is studying.", "They are studying.", "They studying."], "answer": 1, "why": "Plural subjects use are + -ing."}, {"q": "I ___ watching television right now.", "options": ["am not", "do not", "did not"], "answer": 0, "why": "Use am not + -ing for present continuous negatives."}]}, {"title": "Past Continuous", "group": "Foundations", "rule": "Use was/were + verb-ing for an action in progress at a past time, often interrupted by a shorter action.", "example": "I was studying when the rain started.", "questions": [{"q": "At 8 p.m., we ___ dinner.", "options": ["were eating", "ate", "eat"], "answer": 0, "why": "At a particular past time, an action in progress uses past continuous."}, {"q": "She ___ when the phone rang.", "options": ["was sleeping", "slept", "sleeps"], "answer": 0, "why": "The longer background action uses was + -ing."}, {"q": "They ___ walking when it started raining.", "options": ["was", "were", "are"], "answer": 1, "why": "They takes were."}, {"q": "Which sentence is correct?", "options": ["I was read.", "I were reading.", "I was reading."], "answer": 2, "why": "Use was + verb-ing with I."}]}, {"title": "Future Simple", "group": "Foundations", "rule": "Use will + base verb for predictions, promises, and spontaneous decisions.", "example": "I think tomorrow will be sunny.", "questions": [{"q": "I think the weather ___ improve.", "options": ["will", "is", "has"], "answer": 0, "why": "Will + base verb expresses a prediction."}, {"q": "She will ___ the club next year.", "options": ["joins", "join", "joined"], "answer": 1, "why": "The verb after will stays in base form."}, {"q": "Which is a spontaneous offer?", "options": ["I will help you carry that.", "I helped yesterday.", "I am helping now."], "answer": 0, "why": "Will can express an offer made now."}, {"q": "They ___ not forget the deadline.", "options": ["will", "do", "have"], "answer": 0, "why": "The negative future simple is will not."}]}, {"title": "Present Perfect", "group": "Foundations", "rule": "Use have/has + past participle for experiences or past events connected to the present.", "example": "She has completed her application.", "questions": [{"q": "I ___ never tried snowboarding.", "options": ["have", "has", "did"], "answer": 0, "why": "I takes have + past participle."}, {"q": "She has ___ her homework.", "options": ["finish", "finished", "finishing"], "answer": 1, "why": "Use the past participle finished."}, {"q": "Which time expression fits present perfect?", "options": ["last Monday", "yesterday", "so far"], "answer": 2, "why": "So far links the past to the present."}, {"q": "They ___ visited Fujairah before.", "options": ["has", "have", "are"], "answer": 1, "why": "They takes have."}]}, {"title": "Past Perfect", "group": "Foundations", "rule": "Use had + past participle for the earlier of two past actions.", "example": "The bus had left before we arrived.", "questions": [{"q": "By the time I arrived, the lesson ___ started.", "options": ["has", "had", "was"], "answer": 1, "why": "Had started happened before I arrived."}, {"q": "She had ___ before the storm began.", "options": ["leave", "left", "leaving"], "answer": 1, "why": "Past perfect needs the past participle left."}, {"q": "Which event happened first? “I had eaten before I left.”", "options": ["I ate.", "I left.", "They happened together."], "answer": 0, "why": "The had + participle action happened first."}, {"q": "They ___ not packed before the taxi came.", "options": ["have", "had", "did"], "answer": 1, "why": "Past perfect negative uses had not."}]}, {"title": "Zero Conditional", "group": "Conditionals", "rule": "If + present simple, present simple: facts and general truths.", "example": "If it rains heavily, roads become slippery.", "questions": [{"q": "If ice melts, it ___ water.", "options": ["becomes", "will become", "became"], "answer": 0, "why": "General truths use present simple in both clauses."}, {"q": "Zero conditional usually expresses ___.", "options": ["imaginary regrets", "general facts", "future promises"], "answer": 1, "why": "It expresses truths and repeated results."}, {"q": "If people ___ enough water, they feel thirsty.", "options": ["do not drink", "will not drink", "had not drunk"], "answer": 0, "why": "Use present simple in the if-clause."}, {"q": "If the temperature drops below zero, water ___.", "options": ["froze", "freezes", "will have frozen"], "answer": 1, "why": "A scientific fact uses present simple."}]}, {"title": "First Conditional", "group": "Conditionals", "rule": "If + present simple, will + base verb: real possible future results.", "example": "If it rains tomorrow, we will stay inside.", "questions": [{"q": "If I study, I ___ the quiz.", "options": ["pass", "will pass", "would pass"], "answer": 1, "why": "The result of a real future possibility uses will."}, {"q": "If it ___ tomorrow, we will cancel the trip.", "options": ["rains", "will rain", "rained"], "answer": 0, "why": "Use present simple after if."}, {"q": "Which is first conditional?", "options": ["If I were rich, I would travel.", "If she calls, I will answer.", "If water boils, it evaporates."], "answer": 1, "why": "A possible future condition uses if + present and will."}, {"q": "If they leave early, they ___ on time.", "options": ["arrived", "would arrive", "will arrive"], "answer": 2, "why": "Use will + base verb in the result."}]}, {"title": "Second Conditional", "group": "Conditionals", "rule": "If + past simple, would + base verb: unreal or unlikely present/future situations.", "example": "If I had a boat, I would sail every weekend.", "questions": [{"q": "If I ___ a pilot, I would travel widely.", "options": ["am", "were", "will be"], "answer": 1, "why": "Were is standard for hypothetical if I."}, {"q": "If she had more time, she ___ a new skill.", "options": ["would learn", "will learn", "learned"], "answer": 0, "why": "Use would + base verb for an imagined result."}, {"q": "Second conditional usually describes ___.", "options": ["past regrets", "general facts", "imaginary situations"], "answer": 2, "why": "It describes hypothetical present or future situations."}, {"q": "If we lived near the beach, we ___ every day.", "options": ["swam", "would swim", "will swim"], "answer": 1, "why": "The imagined result uses would."}]}, {"title": "Third Conditional", "group": "Conditionals", "rule": "If + past perfect, would have + past participle: unreal past results and regrets.", "example": "If we had left earlier, we would have caught the bus.", "questions": [{"q": "If I had revised, I ___ better.", "options": ["will do", "would have done", "would do"], "answer": 1, "why": "An unreal past result uses would have + participle."}, {"q": "If she ___ the forecast, she would have taken an umbrella.", "options": ["checked", "had checked", "has checked"], "answer": 1, "why": "The past unreal condition uses had + participle."}, {"q": "Third conditional refers to ___.", "options": ["an unreal past", "a daily habit", "a likely future"], "answer": 0, "why": "It imagines a different past."}, {"q": "They would have arrived if the road ___ clear.", "options": ["had been", "is", "will be"], "answer": 0, "why": "The condition requires past perfect."}]}, {"title": "Parts of Speech", "group": "Essentials", "rule": "Nouns name people or things; verbs express actions/states; adjectives describe nouns; adverbs modify verbs/adjectives.", "example": "The confident student spoke clearly.", "questions": [{"q": "Which word is an adjective?", "options": ["quickly", "confident", "speak"], "answer": 1, "why": "Confident describes a person."}, {"q": "In “She practises daily,” practises is a ___.", "options": ["noun", "verb", "adjective"], "answer": 1, "why": "It describes an action."}, {"q": "Which is an adverb?", "options": ["carefully", "careful", "care"], "answer": 0, "why": "Carefully modifies how an action happens."}, {"q": "In “The forecast was accurate,” forecast is a ___.", "options": ["noun", "adverb", "verb"], "answer": 0, "why": "It names a thing."}]}, {"title": "Subject–Verb Agreement", "group": "Essentials", "rule": "A singular third-person subject takes a singular present-simple verb; plural subjects use the base form.", "example": "The student studies; the students study.", "questions": [{"q": "Each student ___ a timetable.", "options": ["have", "has", "having"], "answer": 1, "why": "Each is singular."}, {"q": "The girls ___ ready.", "options": ["is", "are", "was"], "answer": 1, "why": "Girls is plural."}, {"q": "My friend ___ to school early.", "options": ["walk", "walks", "walking"], "answer": 1, "why": "Singular third person takes -s."}, {"q": "The books on the desk ___ mine.", "options": ["is", "are", "was"], "answer": 1, "why": "The subject books is plural."}]}, {"title": "Articles & Determiners", "group": "Essentials", "rule": "Use a before a consonant sound, an before a vowel sound, and the for something specific.", "example": "She bought an umbrella and a jacket.", "questions": [{"q": "It is ___ interesting article.", "options": ["a", "an", "the"], "answer": 1, "why": "Interesting starts with a vowel sound."}, {"q": "I saw ___ rainbow. It was beautiful.", "options": ["a", "an", "no article"], "answer": 0, "why": "First mention of a singular countable noun takes a."}, {"q": "Please close ___ window next to you.", "options": ["a", "an", "the"], "answer": 2, "why": "A specific window takes the."}, {"q": "She studies at ___ university.", "options": ["a", "an", "the"], "answer": 0, "why": "University begins with a /y/ consonant sound."}]}, {"title": "Prepositions", "group": "Essentials", "rule": "Prepositions show time, place, and relationships: in, on, at, between, during, etc.", "example": "The workshop begins at nine on Monday.", "questions": [{"q": "The meeting is ___ Monday.", "options": ["in", "on", "at"], "answer": 1, "why": "Use on with days."}, {"q": "We arrived ___ 8 a.m.", "options": ["at", "on", "in"], "answer": 0, "why": "Use at with clock times."}, {"q": "The books are ___ the shelf.", "options": ["on", "at", "during"], "answer": 0, "why": "On indicates surface location."}, {"q": "It often rains ___ winter.", "options": ["on", "in", "at"], "answer": 1, "why": "Use in with seasons."}]}, {"title": "Comparatives & Superlatives", "group": "Essentials", "rule": "Use -er/more to compare two things and -est/most for the highest degree; learn irregular forms.", "example": "Today is colder than yesterday; January was the coldest month.", "questions": [{"q": "This road is ___ than that one.", "options": ["long", "longer", "longest"], "answer": 1, "why": "Than signals a comparative."}, {"q": "This is the ___ forecast of the week.", "options": ["accurate", "more accurate", "most accurate"], "answer": 2, "why": "The most accurate is a superlative."}, {"q": "Good → better → ___.", "options": ["best", "goodest", "more good"], "answer": 0, "why": "Best is the irregular superlative."}, {"q": "Her idea is ___ interesting than mine.", "options": ["most", "more", "much"], "answer": 1, "why": "Long adjectives take more in comparatives."}]}, {"title": "Modal Verbs", "group": "Essentials", "rule": "Can/could express ability; should advice; must/have to obligation; must not prohibition. Modals take a base verb.", "example": "You should respect your roommate; she can swim.", "questions": [{"q": "You ___ respect shared spaces.", "options": ["must", "must to", "musts"], "answer": 0, "why": "Modals take the base verb."}, {"q": "She ___ swim very well.", "options": ["can", "cans", "can to"], "answer": 0, "why": "Can + base verb expresses ability."}, {"q": "You ___ ask for help if you feel confused.", "options": ["should", "must not", "cannot"], "answer": 0, "why": "Should gives advice."}, {"q": "Students ___ use phones during the exam.", "options": ["must not", "should", "can"], "answer": 0, "why": "Must not expresses prohibition."}]}, {"title": "Conjunctions", "group": "Essentials", "rule": "Use and to add, but to contrast, because to give a reason, although to show unexpected contrast.", "example": "Although it rained, the trip continued.", "questions": [{"q": "I stayed indoors ___ it was pouring.", "options": ["because", "but", "although"], "answer": 0, "why": "Because introduces a reason."}, {"q": "She is friendly ___ responsible.", "options": ["and", "although", "because"], "answer": 0, "why": "And adds similar information."}, {"q": "___ the weather was cold, we went hiking.", "options": ["Because", "Although", "And"], "answer": 1, "why": "Although signals contrast."}, {"q": "I wanted to go, ___ I was ill.", "options": ["but", "because", "and"], "answer": 0, "why": "But contrasts two ideas."}]}, {"title": "Sentence Structure", "group": "Essentials", "rule": "A complete sentence needs a subject and finite verb. Avoid fragments and run-ons.", "example": "The students completed the project before the deadline.", "questions": [{"q": "Which is a complete sentence?", "options": ["Because it was late.", "The team finished early.", "Walking to class."], "answer": 1, "why": "It contains a subject and finite verb."}, {"q": "Choose the correct compound sentence.", "options": ["It rained, but we went.", "It rained but.", "Although it rained but we went."], "answer": 0, "why": "But joins two complete ideas."}, {"q": "Which is a fragment?", "options": ["We left early.", "After the lesson ended.", "The bell rang."], "answer": 1, "why": "It is a dependent clause without a main clause."}, {"q": "Choose the best correction: “It was cold we stayed home.”", "options": ["It was cold, so we stayed home.", "It was cold we, stayed home.", "It was cold, stayed home."], "answer": 0, "why": "A conjunction correctly joins the clauses."}]}, {"title": "Question Forms", "group": "Essentials", "rule": "Use do/does/did for simple-tense questions; invert be or an auxiliary verb when present.", "example": "Does she like winter? Have they arrived?", "questions": [{"q": "___ you enjoy reading?", "options": ["Do", "Does", "Are"], "answer": 0, "why": "Do goes with you in present simple."}, {"q": "Where ___ she live?", "options": ["do", "does", "is"], "answer": 1, "why": "Does introduces a present-simple question."}, {"q": "___ they finished their work?", "options": ["Have", "Do", "Did"], "answer": 0, "why": "Present perfect questions begin with have."}, {"q": "What ___ you doing now?", "options": ["do", "are", "did"], "answer": 1, "why": "Present continuous questions use are + -ing."}]}, {"title": "Negatives", "group": "Essentials", "rule": "Use do/does not for present simple, did not for past simple, and not after be or other auxiliaries.", "example": "She does not like rain; they were not waiting.", "questions": [{"q": "He ___ like crowded rooms.", "options": ["does not", "do not", "is not"], "answer": 0, "why": "Singular present simple negative uses does not."}, {"q": "We did not ___ late.", "options": ["arrived", "arrive", "arriving"], "answer": 1, "why": "Did not takes a base verb."}, {"q": "They ___ watching the forecast.", "options": ["are not", "do not", "did not"], "answer": 0, "why": "Present continuous negative uses are not."}, {"q": "She has ___ finished the task.", "options": ["not", "no", "does not"], "answer": 0, "why": "Put not after has in present perfect."}]}], "reading": [{"title": "A New Roommate", "chapter": "Chapter 1", "skill": "Main idea and inference", "text": "When Salma arrived at her college residence hall, she felt both excited and nervous. Her new roommate, Noor, liked studying with music, while Salma needed silence. At first, neither girl mentioned the problem. Salma moved to the library every evening, and Noor wondered why her roommate rarely stayed in their room. After a week, they attended a residence meeting about considerate shared living. The adviser suggested that roommates discuss their needs rather than make assumptions. That night, Salma explained that music distracted her, especially before exams. Noor said she had thought the music made the room feel welcoming. Together, they agreed to use headphones during study hours and to invite friends only after checking with each other. They also created a simple cleaning schedule. By the end of the month, the room felt like a comfortable place for both girls. Salma learned that privacy did not mean avoiding people; it meant setting respectful boundaries. Noor discovered that small changes could help a community get along. Their friendship grew because they communicated honestly rather than waiting for someone else to solve the problem.", "questions": [{"q": "What is the main message?", "options": ["Roommates should avoid each other.", "Respectful communication solves shared-living problems.", "Music is always harmful."], "answer": 1, "why": "Their agreement resulted from discussing needs."}, {"q": "Why did Salma visit the library?", "options": ["She needed quiet.", "She disliked Noor personally.", "She wanted to move rooms."], "answer": 0, "why": "The passage says she needed silence."}, {"q": "What did Noor originally believe?", "options": ["Salma hated college.", "Music made the room welcoming.", "Cleaning was unnecessary."], "answer": 1, "why": "Noor explains her original assumption."}, {"q": "What does “considerate” most nearly mean?", "options": ["thoughtful of others", "extremely busy", "easily annoyed"], "answer": 0, "why": "Being considerate means respecting others’ needs."}, {"q": "Which action shows compromise?", "options": ["Ignoring the issue", "Using headphones during study hours", "Leaving college"], "answer": 1, "why": "Headphones address both roommates’ preferences."}, {"q": "What can we infer about Salma?", "options": ["She learned to express her needs.", "She never studies.", "She dislikes friendships."], "answer": 0, "why": "She began communicating openly."}, {"q": "Which detail supports the main idea?", "options": ["They agreed on study hours and visitors.", "The room was upstairs.", "Salma arrived in autumn."], "answer": 0, "why": "Their negotiated rules demonstrate communication."}, {"q": "What is the author’s purpose?", "options": ["To explain how to manage shared living", "To advertise headphones", "To describe a science experiment"], "answer": 0, "why": "The narrative illustrates shared-living strategies."}]}, {"title": "The Graduation Survey", "chapter": "Chapter 1", "skill": "Evidence and author purpose", "text": "A student council surveyed 120 Grade 9 learners about the skills they thought would matter most after graduation. Forty-eight students selected self-management, thirty-six chose communication, twenty-four selected digital literacy, and twelve chose financial planning. The council noticed that many students associated graduation with receiving a certificate, but fewer considered the everyday demands of further study. To respond, the council organised a Skills for the Future week. One group demonstrated how to break a large assignment into smaller deadlines. Another group role-played respectful conversations between roommates. A third group explained how to plan a simple monthly budget. At the end of the week, students completed a short reflection. Several wrote that self-management did not mean doing everything alone; it also meant knowing when to ask for support. The council did not claim that its activities guaranteed future success. Instead, it recommended repeating the survey later to see whether students’ priorities had changed. The organisers concluded that graduation should be seen as a beginning that requires responsibility, adaptability, and lifelong learning.", "questions": [{"q": "How many students selected communication?", "options": ["24", "36", "48"], "answer": 1, "why": "The passage states thirty-six."}, {"q": "Which skill received the most votes?", "options": ["Self-management", "Digital literacy", "Financial planning"], "answer": 0, "why": "Forty-eight is the largest number."}, {"q": "What is the main idea?", "options": ["Certificates are enough.", "Preparation for life after graduation involves practical skills.", "Surveys are never useful."], "answer": 1, "why": "The activities develop practical skills."}, {"q": "What does “priorities” mean here?", "options": ["important concerns", "school buildings", "exam results"], "answer": 0, "why": "Priorities are what people consider most important."}, {"q": "Why does the council suggest another survey?", "options": ["To measure possible changes", "To cancel graduation", "To choose new teachers"], "answer": 0, "why": "A follow-up would reveal changed priorities."}, {"q": "Which claim is supported by data?", "options": ["All students love budgeting.", "12 students chose financial planning.", "No student needs communication."], "answer": 1, "why": "The number is explicitly reported."}, {"q": "What is the writer’s attitude toward the programme?", "options": ["Carefully positive", "Completely dismissive", "Angry"], "answer": 0, "why": "The text acknowledges benefits without guaranteeing success."}, {"q": "What can be inferred from the reflections?", "options": ["Asking for help can be responsible.", "Independent people never need support.", "Deadlines are irrelevant."], "answer": 0, "why": "Students recognise help-seeking as self-management."}]}, {"title": "A Forecast That Changed the Plan", "chapter": "Chapter 2", "skill": "Sequencing and cause-effect", "text": "The Grade 9 outdoor club planned a weekend walk in the mountains. On Thursday, the forecast predicted clear skies, so the students prepared water bottles, maps, and comfortable shoes. On Friday afternoon, however, the forecast changed. Meteorologists expected heavy rain and strong winds near the walking route. Some students argued that the group should continue because they had already prepared. Their leader, Hessa, asked them to consider the evidence rather than their disappointment. She explained that mountain paths could become slippery during a downpour and that sudden water flow could make low areas dangerous. The club postponed the walk and organised an indoor map-reading challenge instead. During the challenge, teams used weather symbols to select safe travel routes. One team initially chose the shortest route, but then noticed that it crossed a valley marked as flood-prone. They changed their answer and explained their reasoning. The following week, the forecast improved and the club completed its walk safely. Students agreed that adapting a plan was not the same as giving up. It was a way to protect people while keeping the original goal in sight.", "questions": [{"q": "What was the original plan?", "options": ["An indoor concert", "A mountain walk", "A beach clean-up"], "answer": 1, "why": "The club planned a mountain walk."}, {"q": "What changed on Friday?", "options": ["The weather forecast", "The number of teachers", "The school term"], "answer": 0, "why": "The forecast predicted rain and wind."}, {"q": "Why was the walk postponed?", "options": ["Students forgot maps.", "Mountain routes could become unsafe.", "Hessa disliked hiking."], "answer": 1, "why": "Heavy rain creates slippery paths and flooding risks."}, {"q": "What does “postponed” mean?", "options": ["cancelled forever", "delayed until later", "started early"], "answer": 1, "why": "They walked the following week."}, {"q": "Which event happened immediately after postponement?", "options": ["The club held a map-reading challenge.", "They walked in the rain.", "They visited a university."], "answer": 0, "why": "The indoor challenge replaced the walk."}, {"q": "Why did a team change its route?", "options": ["It crossed a flood-prone valley.", "It was too scenic.", "It included a museum."], "answer": 0, "why": "They spotted a flood risk."}, {"q": "Which statement best expresses the lesson?", "options": ["Never plan outdoor events.", "Adapting to evidence is responsible.", "The shortest route is always best."], "answer": 1, "why": "The club adjusted its plan for safety."}, {"q": "What kind of evidence influenced the decision?", "options": ["A weather forecast", "A social media advertisement", "A school timetable"], "answer": 0, "why": "The forecast was the basis for postponing."}]}, {"title": "Learning to Snowboard", "chapter": "Chapter 2", "skill": "Vocabulary and inference", "text": "Alya had always preferred sunny beaches to freezing mountain weather. When her family suggested a winter holiday, she was unsure whether she would enjoy it. Her cousin Dana, however, was enthusiastic about snowboarding and promised to help Alya learn. On the first morning, Alya could barely stand on the board. She fell repeatedly and began to think that she had no ability for the sport. Dana reminded her that a new skill develops through practice, not instant success. They set three small goals: balancing for ten seconds, moving down a gentle slope, and stopping safely. By lunchtime, Alya had achieved the first goal. The second took two more days. Instead of comparing herself with experienced snowboarders, she recorded her own progress. On the final day, she completed the gentle slope without falling. She still preferred warm weather, but she no longer believed that discomfort meant failure. At home, Alya wrote about the experience for her school blog. She encouraged readers to choose a realistic challenge, ask for guidance, and notice gradual improvement. Her favourite part of the trip was not the mountain view; it was discovering that confidence could grow through patient effort.", "questions": [{"q": "How did Alya feel at first?", "options": ["Certain she would love snowboarding", "Unsure about the winter holiday", "Angry with her cousin"], "answer": 1, "why": "She was unsure she would enjoy it."}, {"q": "What was her first goal?", "options": ["Balance for ten seconds", "Race experts", "Jump from a steep slope"], "answer": 0, "why": "Balancing was the first goal."}, {"q": "What does “gradual” mean?", "options": ["happening step by step", "instant", "impossible"], "answer": 0, "why": "Her skills improved over several days."}, {"q": "What helped Alya most?", "options": ["Comparing herself with experts", "Small goals and practice", "Avoiding the sport"], "answer": 1, "why": "She set manageable goals and persisted."}, {"q": "What can be inferred about Dana?", "options": ["She is supportive.", "She is impatient.", "She dislikes sports."], "answer": 0, "why": "Dana offers guidance and encouragement."}, {"q": "Which detail shows growth?", "options": ["Alya learned to stop safely on the gentle slope.", "Alya always loved cold weather.", "Alya refused to practise."], "answer": 0, "why": "She progressed from falling to completing the slope."}, {"q": "What is the central theme?", "options": ["Skill develops with effort.", "Winter is better than summer.", "Talent cannot change."], "answer": 0, "why": "The text emphasises practice and confidence."}, {"q": "What is the author’s purpose?", "options": ["To inspire learners to persevere", "To sell sports equipment", "To warn against all travel"], "answer": 0, "why": "The narrative illustrates perseverance."}]}], "writing": [{"title": "Strong Topic Sentences", "chapter": "Chapter 1", "goal": "Identify clear paragraph focus.", "questions": [{"q": "Best topic sentence for shared living?", "options": ["There are many things.", "Respectful communication helps roommates live successfully together.", "My room is blue."], "answer": 1, "why": "It introduces one focused idea."}, {"q": "Which sentence is too broad?", "options": ["Students should agree on quiet hours.", "College life includes everything in the world.", "Roommates benefit from clear rules."], "answer": 1, "why": "It cannot be developed meaningfully in one paragraph."}, {"q": "Which supporting detail fits “Planning helps students succeed”?", "options": ["A weekly timetable breaks tasks into steps.", "The beach is crowded.", "The weather is sunny."], "answer": 0, "why": "The timetable illustrates planning."}, {"q": "What should a topic sentence usually do?", "options": ["Introduce the paragraph’s main idea", "List unrelated facts", "Repeat the conclusion"], "answer": 0, "why": "It signals the paragraph focus."}, {"q": "Which topic sentence is most precise?", "options": ["Responsibility matters.", "Students can share cleaning duties to keep their room organised.", "Things are good."], "answer": 1, "why": "It names a specific action and result."}]}, {"title": "Organise an Informational Paragraph", "chapter": "Chapter 1", "goal": "Recognise logical paragraph organisation.", "questions": [{"q": "Which should normally come first?", "options": ["Topic sentence", "Concluding sentence", "Unrelated example"], "answer": 0, "why": "A topic sentence introduces the focus."}, {"q": "Which detail best follows “Respecting privacy builds trust”?", "options": ["Ask permission before borrowing personal items.", "The mountains are cold.", "I prefer blue shoes."], "answer": 0, "why": "The example supports respecting privacy."}, {"q": "Choose the best transition to add another benefit.", "options": ["However", "Furthermore", "Although"], "answer": 1, "why": "Furthermore adds a related point."}, {"q": "Which sentence is a suitable conclusion?", "options": ["Therefore, clear agreements make shared living more comfortable.", "Yesterday I saw a cat.", "But also because."], "answer": 0, "why": "It sums up the paragraph."}, {"q": "Which is the most logical order?", "options": ["Example → conclusion → topic", "Topic → support → conclusion", "Conclusion → unrelated detail → topic"], "answer": 1, "why": "Organised paragraphs develop the main idea logically."}]}, {"title": "Thesis Statements & Opinions", "chapter": "Chapter 1", "goal": "Distinguish an arguable position from a vague statement.", "questions": [{"q": "Best thesis for an opinion essay?", "options": ["I will discuss shared living.", "Shared living benefits students by building responsibility and communication skills.", "Students live in buildings."], "answer": 1, "why": "It states a position and reasons."}, {"q": "Which is a counterargument?", "options": ["Some argue that shared rooms reduce privacy.", "Shared living is my topic.", "The weather is sunny."], "answer": 0, "why": "A counterargument introduces an opposing view."}, {"q": "Which transition introduces contrast?", "options": ["Moreover", "However", "For example"], "answer": 1, "why": "However signals contrast."}, {"q": "Which is the strongest supporting reason?", "options": ["It is nice.", "Shared living teaches students to negotiate rules respectfully.", "Because yes."], "answer": 1, "why": "It provides a concrete reason."}, {"q": "Which conclusion fits an opinion essay?", "options": ["In conclusion, the benefits outweigh the challenges when roommates communicate.", "There are many rooms.", "I am starting my essay."], "answer": 0, "why": "It restates the judgment."}]}, {"title": "Weather: Cause, Effect & Advice", "chapter": "Chapter 2", "goal": "Write clear explanations and advice about weather.", "questions": [{"q": "Which sentence shows cause and effect?", "options": ["Because it was pouring, the trip was postponed.", "The trip, the rain.", "It was pouring although."], "answer": 0, "why": "Because introduces the cause."}, {"q": "Choose the clearest advice.", "options": ["You should check the forecast before hiking.", "Check maybe good.", "You must to forecast."], "answer": 0, "why": "Should + base verb gives clear advice."}, {"q": "Best transition for a result?", "options": ["Therefore", "Although", "Meanwhile"], "answer": 0, "why": "Therefore introduces a result."}, {"q": "Which sentence is grammatically correct?", "options": ["If it rains, we will stay inside.", "If it will rain, we stay inside.", "If it rained, we will stayed."], "answer": 0, "why": "First conditional uses present + will."}, {"q": "Which is an effective closing sentence?", "options": ["Careful planning helps travellers stay safe in changing weather.", "And the weather.", "The end because rain."], "answer": 0, "why": "It summarises the main message."}]}, {"title": "Editing: Abilities & Goals", "chapter": "Chapter 2", "goal": "Correct modal verbs, agreement, punctuation and clarity.", "questions": [{"q": "Choose the correct sentence.", "options": ["She can to snowboard.", "She can snowboard.", "She cans snowboard."], "answer": 1, "why": "Can takes the base verb without to."}, {"q": "Which sentence is correctly punctuated?", "options": ["I have three goals: practise, improve, and succeed.", "I have three goals practise improve succeed", "I have three goals; practise improve and succeed"], "answer": 0, "why": "A colon can introduce a list."}, {"q": "Which is the clearest goal?", "options": ["I will practise speaking for ten minutes each day.", "I will be better somehow.", "Good skills someday."], "answer": 0, "why": "It gives a measurable action."}, {"q": "Correct the error: “She does not feel confident.”", "options": ["She doesn’t feel confident.", "She not feel confident.", "She didn’t feels confident."], "answer": 0, "why": "Singular present simple negative uses does not + base."}, {"q": "Which is the best revision?", "options": ["I practiced and got better at speaking.", "I practice improve good.", "Me skill was practice."], "answer": 0, "why": "It uses clear grammar and sequence."}]}]};
const app=document.getElementById('app');let section='home',filter='All',current=null,step=0,score=0,chosen=null,checked=false;const KEY='g9_english_adventure_v2';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=(s,i)=>s+':'+i;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};const counts=()=>Object.keys(saved).length;function home(){section='home';let completed=counts();app.innerHTML=`<div class="bar"><div><h2>Choose your learning path</h2><div class="muted">You can study any skill in any order. Feedback appears after every question.</div></div><span class="pill">${completed} activities completed</span></div><div class="cards">${[['grammar','Grammar Lab','21 topics · 84 questions','Learn tenses, conditionals, and essential grammar.'],['reading','Reading Detective','4 passages · 32 questions','Explore main idea, inference, evidence, and vocabulary.'],['writing','Writing Studio','5 activities · 25 questions','Build paragraphs, thesis statements, and editing skills.']].map(([s,t,n,d])=>`<div class="card"><div class="tag">${n}</div><h3>${t}</h3><p>${d}</p><button class="primary" onclick="listing('${s}')">Explore ${t} →</button></div>`).join('')}</div><div class="panel" style="margin-top:17px"><h3>My Progress</h3><p class="muted">Your scores are stored on this device only. They are not sent to your teacher automatically.</p><div class="buttons"><button class="primary" onclick="results()">View results</button><button class="ghost" onclick="window.print()">Print this page</button></div></div><p class="muted" style="margin-top:16px">Chapter 1: Meeting New People, Learning New Things · Chapter 2: Come Rain or Shine. Grammar Foundations and Conditionals are supplementary revision and extension topics.</p>`}
function listing(s){section=s;filter='All';drawListing()}function drawListing(){const arr=DATA[section];let groups=section==='grammar'?['All','Foundations','Conditionals','Essentials']:['All','Chapter 1','Chapter 2'];let visible=filter==='All'?arr:arr.filter(x=>(x.group||x.chapter)===filter);app.innerHTML=`<div class="bar"><button class="ghost" onclick="home()">← Home</button><span class="pill">${section==='grammar'?'Grammar Lab':section==='reading'?'Reading Detective':'Writing Studio'}</span></div><h2>Select an activity</h2><div class="filters">${groups.map(g=>`<button class="${g===filter?'active':''}" onclick="setFilter('${g}')">${g}</button>`).join('')}</div><div class="cards">${visible.map(x=>{let i=arr.indexOf(x),k=id(section,i),r=saved[k];return `<div class="card"><div class="tag">${esc(x.group||x.chapter)} · ${x.questions.length} questions</div><h3>${esc(x.title)}</h3><p>${esc(x.rule||x.skill||x.goal)}</p>${r?`<div class="pill" style="display:inline-block;margin-bottom:12px">Best score: ${r.score}/${r.total}</div>`:''}<br><button class="primary" onclick="start('${section}',${i})">${r?'Practise again':'Start activity'} →</button></div>`}).join('')}</div>`}function setFilter(f){filter=f;drawListing()}
function start(s,i){section=s;current=i;step=0;score=0;chosen=null;checked=false;question()}
function question(){const obj=DATA[section][current],q=obj.questions[step],pct=Math.round(step/obj.questions.length*100);let intro=section==='grammar'?`<div class="rule"><strong>Rule:</strong> ${esc(obj.rule)}<br><strong>Example:</strong> <em>${esc(obj.example)}</em></div>`:section==='reading'?`<div class="passage">${esc(obj.text)}</div>`:`<div class="rule">Goal: ${esc(obj.goal)}</div>`;app.innerHTML=`<div class="bar"><button class="ghost" onclick="listing('${section}')">← Activities</button><span class="pill">${esc(obj.title)}</span></div><div class="panel"><div class="bar"><span class="tag">Question ${step+1} of ${obj.questions.length}</span><span class="muted">Score: ${score}</span></div><div class="progress"><span style="width:${pct}%"></span></div>${intro}<h3 style="margin-top:24px">${esc(q.q)}</h3><div id="choices">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''} ${checked&&i===q.answer?'correct':''} ${checked&&chosen===i&&i!==q.answer?'wrong':''}" ${checked?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback">${checked?`<div class="feedback ${chosen===q.answer?'good':''}"><strong>${chosen===q.answer?'Correct!':'Not quite.'}</strong> The correct answer is <strong>${esc(q.options[q.answer])}</strong>.<br>${esc(q.why)}</div>`:''}</div><div class="buttons">${!checked?`<button class="primary" onclick="check()" ${chosen===null?'disabled':''}>Check answer</button>`:`<button class="primary" onclick="next()">${step===obj.questions.length-1?'See results':'Next question →'}</button>`}</div></div>`}
function choose(i){if(checked)return;chosen=i;question()}function check(){if(chosen===null)return;checked=true;if(chosen===DATA[section][current].questions[step].answer)score++;question()}function next(){let obj=DATA[section][current];if(step===obj.questions.length-1){let k=id(section,current);if(!saved[k]||score>saved[k].score)saved[k]={score,total:obj.questions.length,title:obj.title,section,updated:new Date().toLocaleDateString()};persist();finish()}else{step++;chosen=null;checked=false;question()}}
function finish(){const obj=DATA[section][current];app.innerHTML=`<div class="panel"><div class="tag">Activity complete</div><h2>${esc(obj.title)}</h2><p style="font-size:2rem;font-weight:800;color:#0b7775">${score} / ${obj.questions.length}</p><p>${score===obj.questions.length?'Excellent — every answer was correct.':'Review the explanations and try again to improve.'}</p><div class="buttons"><button class="primary" onclick="start('${section}',${current})">Try again</button><button class="ghost" onclick="listing('${section}')">Choose another</button><button class="ghost" onclick="results()">My results</button></div></div>`}
function results(){section='results';const items=Object.values(saved),total=items.reduce((a,b)=>a+b.score,0),max=items.reduce((a,b)=>a+b.total,0);app.innerHTML=`<div class="bar"><button class="ghost" onclick="home()">← Home</button><span class="pill">My Progress</span></div><div class="panel"><h2>Student results</h2><p class="muted">These are best scores on this device. Enter your name only if you plan to print or save this report.</p><label>Student name <input id="student" placeholder="Enter your name"></label><div class="results" style="margin-top:20px"><div class="result"><div class="muted">Activities</div><strong>${items.length}</strong></div><div class="result"><div class="muted">Points earned</div><strong>${total}/${max}</strong></div><div class="result"><div class="muted">Accuracy</div><strong>${max?Math.round(100*total/max):0}%</strong></div></div><h3 style="margin-top:25px">Completed activities</h3>${items.length?items.map(x=>`<div class="result" style="margin:8px 0"><strong style="font-size:1rem">${esc(x.title)}</strong><span style="float:right">${x.score}/${x.total}</span><div class="muted">${esc(x.section)} · ${esc(x.updated)}</div></div>`).join(''):'<p>No activities completed yet.</p>'}<div class="buttons no-print"><button class="primary" onclick="window.print()">Print / Save as PDF</button><button class="ghost" onclick="if(confirm('Clear scores saved on this device?')){saved={};persist();results()}">Clear my scores</button></div><p class="muted small">Scores are from automatically checked multiple-choice questions, not from full essay assessment.</p></div>`}
home();</script></body></html>
