by number and relative distance.","These witnesses were standing near the runway.","This passengers → These passengers.",["___ reports contain new information.|This|These|That|1","___ witness beside me saw everything.|This|These|Those|0","Look at ___ aircraft in the distance.|these|those|that|2"]],["Subordinating Conjunctions","because / although / while / when / if / unless","Link a dependent clause to a main clause to express cause, contrast, time or condition.","Although the weather was poor, the plane landed safely.","Although the storm was severe, but the plane landed → Although the storm was severe, the plane landed.",["___ the visibility was low, the pilot landed safely.|Although|Because of|Despite of|0","The crew waited ___ the runway was cleared.|until|unless|although|0","The reporter checked the facts ___ publishing.|before|because|unless|0"]],["Question Tags","positive statement + negative tag; negative statement + positive tag","Check information or invite confirmation; match the auxiliary and subject.","The passengers are safe, aren’t they?","The pilot was calm, isn’t he? → wasn’t he?",["The crew arrived early, ___?|didn’t they|weren’t they|don’t they|0","The report isn’t final, ___?|isn’t it|is it|does it|1","You have seen the footage, ___?|haven’t you|didn’t you|aren’t you|0"]],["Adverbs of Degree","very, extremely, quite, too, enough, almost","Modify the strength or extent of an adjective, adverb or action.","The passengers were extremely nervous.","Enough clear → clear enough.",["The weather was ___ dangerous to fly.|too|enough|almostly|0","The report was detailed ___ to explain the event.|too|enough|very|1","The journalist was ___ certain of the facts.|completely|complete|completion|0"]]],"mazes":[["Vocabulary 1 · Health Advice","A Picture of Health","During examination week, Mariam began to feel unwell. She had a headache and an [[1]], so her mother arranged a medical appointment. The doctor asked about her [[2]] and whether she had been sleeping properly. Mariam admitted that schoolwork was causing considerable [[3]]. After a careful examination, the doctor wrote a [[4]] for suitable medicine and advised her to rest. He also warned her not to believe every treatment advertised online. Some websites make [[5]] claims to sell products that have not been tested. Mariam realised that a reliable source should explain possible risks as well as benefits. She decided to ask a qualified professional before trying unfamiliar treatments. Over the next few days, she followed the advice, reduced her screen time before bed, and felt better. The experience taught her that medical information can be useful, but it must be checked carefully rather than accepted simply because it appears on a popular website.",[["upset stomach","investigation","commercial"],["slogans","injuries","symptoms"],["connectivity","scene","stress"],["remedy","slogan","prescription"],["informative","fraudulent","memorable"]],[0,2,2,2,1]],["Vocabulary 2 · Medical Claims","A Picture of Health","A popular video promised a quick [[1]] for almost every illness. Its presenter used confident language, but a doctor noticed several [[2]] statements about treatment. The video claimed that people with a particular [[3]] could recover immediately without medical advice. Viewers who felt [[4]] about their health were especially likely to believe the message. One teenager shared it with a friend who had a severe [[5]]. Fortunately, the friend spoke to a dentist rather than following the video. The dentist explained that pain can have several causes and that proper diagnosis is important. The teenager later compared information from hospital websites and learned to recognise reliable advice. She noticed that trustworthy articles named their sources and explained the limits of their claims. Her teacher used the incident in a lesson about evaluating online information. The class agreed that attractive videos may be persuasive, but evidence matters more than popularity when people make decisions about their health.",[["scene","slogan","remedy"],["informative","dishonest","memorable"],["commercial","prescription","syndrome"],["productive","connected","nervous"],["toothache","investigation","slogan"]],[2,1,2,2,0]],["Vocabulary 3 · A Newsroom","Infotainment","At the local news station, reporters prepared a special programme about an airport incident. A [[1]] who had been near the runway agreed to describe what she saw. The police [[2]] was still continuing, so the presenter avoided making unsupported claims. Several passengers had minor [[3]], but the medical team confirmed that everyone was receiving appropriate care. The first reporter to reach the [[4]] checked information with emergency workers before speaking on camera. Meanwhile, improved internet [[5]] allowed the newsroom to receive updates from different locations. Editors compared the reports carefully and removed details that could not be verified. They wanted the programme to be accurate rather than dramatic. Although the story attracted a large audience, the editor reminded the team that speed should never replace responsibility. After the broadcast, viewers praised the calm explanations and the clear distinction between confirmed facts and unanswered questions. The journalists considered this response an important measure of success.",[["remedy","witness","slogan"],["investigation","commercial","productivity"],["symptoms","injuries","prescriptions"],["slogan","scene","syndrome"],["dishonesty","toothache","connectivity"]],[1,0,1,1,2]],["Vocabulary 4 · Advertising Messages","Infotainment","A media class studied how advertisements influence audiences. One television [[1]] used a colourful animation to promote a new learning application. Its short [[2]] was repeated several times, making the message easy to remember. Students agreed that the advertisement was [[3]], but they questioned whether it explained the product honestly. Another advertisement was more [[4]] because it provided clear details about cost, features, and limitations. The teacher asked the class to consider how media tools affect [[5]] when students work online. Some students said that notifications interrupt their concentration, while others argued that shared documents make teamwork easier. The discussion showed that digital media can entertain, inform, and persuade at the same time. Before the lesson ended, each group designed a short message that included both benefits and possible drawbacks. They learned that responsible communication does not simply attract attention; it also helps people make informed choices.",[["commercial","investigation","prescription"],["syndrome","witness","slogan"],["fraudulent","nervous","memorable"],["injured","informative","dishonest"],["remedy","productivity","toothache"]],[0,2,2,1,1]],["Grammar 1 · Health Advice and Online Claims","Infotainment","At the school health club, students regularly discuss how to find trustworthy medical advice. Each week, an informative article [[1]] on the club's noticeboard. Recently, members [[2]] information about misleading health advertisements. Their teacher explained that [[3]] online claims should be checked before anyone follows them. Although some videos appear convincing, they may leave out important facts about treatments. One student described a website promising an instant remedy for every illness. The group agreed that the message sounded [[4]] good to be true. They also discussed the importance of consulting qualified professionals when symptoms continue. After the discussion, the students designed a simple checklist for evaluating health information. Their teacher praised the project because it encouraged careful thinking rather than fear. The club plans to share the carefully prepared checklist with younger students during a school awareness campaign next month. The checklist helps students make safer choices, [[5]]?",[["are displayed","is displayed","displays"],["collected","has collecting","have been collecting"],["these","this","that"],["very much","too","enough"],["doesn't it","didn't it","didn't they"]],[1,2,0,1,0]],["Grammar 2 · Managing Exam Stress","Infotainment","During examination week, a group of students organised a short workshop about stress. [[1]] that some classmates were sleeping poorly, they invited a school counsellor to speak. The counsellor explained that students often feel nervous [[2]] they have several deadlines at once. For the past two weeks, the group [[3]] practical strategies for managing pressure. Their suggestions included preparing a realistic study schedule, taking short breaks and speaking to trusted adults. At the workshop, [[4]] students sitting near the front shared their experiences, while others wrote anonymous questions. The counsellor reminded everyone that advice found online should be checked carefully. She also explained that a healthy routine does not remove every difficulty, but it can make everyday challenges easier to manage. By the end of the session, the students felt more confident about asking for help. The students agreed that the practical workshop was useful, [[5]]?",[["Noticed","Notice","Noticing"],["because","although","unless"],["are test","have been testing","has tested"],["this","that","these"],["wasn't it","didn't it","isn't it"]],[2,0,1,2,0]],["Grammar 3 · Commercials and Digital Media","Infotainment","A media club studied how television commercials influence viewers. Every Friday, an advertisement [[1]] by the students, who discuss its images and language. During their latest meeting, the group examined a memorable slogan used in a sports commercial. [[2]] the message was entertaining, several students questioned whether it gave enough information about the product. One member, [[3]] the advertisement closely, noticed that important details appeared only briefly at the bottom of the screen. The teacher asked the class to compare the slogan with the factual information provided. The students agreed that commercials can be creative without always being informative. For several weeks, they [[4]] examples of persuasive techniques in different types of media. Their final presentation explained how colour, music and repetition shape viewers' reactions. The club's conclusions were clear, [[5]]? The students hoped their project would encourage others to think critically about advertisements.",[["is analysed","analyses","are analysing"],["Unless","Although","Because of"],["examined","examine","examining"],["have been gathering","has been gathered","gather"],["aren't they","weren't they","didn't they"]],[0,1,2,0,1]],["Grammar 4 · A Responsible News Update","Infotainment","A local news channel prepared a report about a flight that had been delayed because of poor weather. Before broadcasting, every statement [[1]] by the editor. Since the morning, reporters [[2]] official updates rather than repeating rumours. [[3]] the situation carefully, the presenter explained that the passengers were waiting safely inside the terminal. The station avoided dramatic images and focused on practical information for travellers. An airport representative said that [[4]] notices near the information desk contained the latest departure details. Although some viewers wanted immediate answers, the presenter reminded them that accuracy was more important than speed. The programme also explained how journalists verify information before sharing it with the public. By the end of the report, the weather had improved and staff were helping passengers make new arrangements. The news update was [[5]] informative that several viewers shared it with relatives who were travelling that day.",[["are checked","is checked","checks"],["has requested","are request","have been requesting"],["Reviewing","Reviewed","Review"],["that","these","this"],["too","enough","so"]],[1,2,0,1,2]]],"readings":[["Reading 1 · Can We Really Live Longer?","At grade level","A Picture of Health","People often ask why some communities have unusually high numbers of older adults who remain active. Researchers have examined diet, exercise, medical care, social relationships and everyday routines. Their findings suggest that no single habit guarantees a long life. Instead, several influences may work together over many years. In one community, older residents walk to local shops rather than driving short distances. They also meet neighbours regularly and share meals with relatives. These routines provide movement and social contact without requiring expensive equipment. However, researchers warn against assuming that every resident follows the same lifestyle or enjoys the same health. Income, housing and access to doctors can make a significant difference. Online articles sometimes describe a particular food as the secret to living longer. Such headlines attract attention, but they often simplify studies that involved many factors. A small study may identify an interesting connection without proving that one habit caused a result. Experts therefore advise readers to check who conducted the research and whether other studies reached similar conclusions. For teenagers, the most useful lesson may be that health develops through repeated choices. Regular sleep, balanced meals, physical activity and supportive friendships are sensible goals even though none can promise a specific lifespan. Schools can encourage these habits, while communities can make healthy choices easier by providing safe parks and accessible services. Longevity is not simply an individual achievement; it also reflects the conditions in which people live. A responsible health message should recognise both personal choices and wider opportunities. Researchers also note that public health policies influence whether families can find affordable food, reliable transport and safe places for exercise. These conditions affect opportunities long before people reach old age.",[["What is the main message of the passage?",["One food guarantees a longer life.","Several influences contribute to health over time.","Medical care has little importance."],1,"The text argues that longevity reflects multiple interacting factors."],["Why do researchers mention walking to shops?",["To illustrate movement within daily routines.","To show that driving is always harmful.","To prove older people dislike exercise."],0,"Walking is an example of regular physical activity."],["Which factor is described as affecting access to health?",["Advertisement slogans.","Television schedules.","Income and housing."],2,"The passage explicitly names income and housing."],["Why can a small study be misleading in headlines?",["It always contains false data.","It may show a link without proving cause.","It cannot include older adults."],1,"A correlation does not establish causation."],["What does “accessible” most nearly mean here?",["Easy to use or reach.","Expensive to maintain.","Designed for specialists."],0,"Accessible services can be reached and used."],["Which habit is NOT described as a sensible goal?",["Regular sleep.","Balanced meals.","Buying costly equipment."],2,"The passage explicitly says movement need not require costly equipment."],["What can schools do according to the passage?",["Encourage healthy routines.","Promise students longer lives.","Replace all medical services."],0,"Schools can encourage positive habits."],["What does the writer imply about health advice?",["It should focus only on personal discipline.","It should acknowledge personal and social factors.","It should avoid discussing research."],1,"The conclusion includes individual choices and wider conditions."]]],["Reading 2 · Should We Trust Online Medical Advice?","At grade level","A Picture of Health","When a teenager develops a headache or an upset stomach, searching online may seem faster than arranging a medical appointment. Health websites can explain common symptoms, introduce useful vocabulary and suggest when professional care is necessary. Yet the quality of online advice varies widely. Some articles are written or reviewed by qualified specialists, while others are designed mainly to attract visitors or sell products. A trustworthy source usually identifies its author, explains when information was updated and distinguishes general guidance from personal diagnosis. It may also describe uncertainty instead of claiming that one remedy works for everyone. These details are less exciting than a dramatic promise, but they help readers judge reliability. Social media creates another difficulty. A personal story can feel convincing because the speaker seems sincere. However, one person's experience does not establish that a treatment is safe or effective for other people. A video may leave out important details about the person's medical history. Students should also be careful with advertisements that imitate independent medical articles. A commercial message may use scientific words without offering evidence. Comparing several reputable sources can help, but it does not replace professional advice when symptoms are serious or persistent. Schools can teach students to ask useful questions: Who wrote this? What evidence supports it? Is the information current? Is someone trying to sell me something? These questions develop digital judgement as well as health awareness. The internet can support informed conversations with healthcare professionals, provided readers recognise its limits. Responsible searching means using information to prepare better questions, not treating a screen as a substitute for a qualified diagnosis.",[["What is the passage mainly about?",["Why all health websites are unsafe.","How to judge online medical information.","Why doctors should avoid technology."],1,"The text provides criteria for evaluating online advice."],["Which feature supports a website’s credibility?",["An identified expert author.","A dramatic headline.","A large number of advertisements."],0,"The author and review details help readers assess credibility."],["Why might a personal video be misleading?",["It always contains deliberate lies.","It is usually too short to watch.","One experience may not apply to others."],2,"Individual experiences do not establish general effectiveness."],["What can advertisements sometimes imitate?",["Independent health articles.","Hospital waiting rooms.","Medical appointments."],0,"The passage warns about advertising disguised as articles."],["What does “persistent” mean in context?",["Occurring only once.","Continuing over time.","Easy to describe."],1,"Persistent symptoms continue or recur."],["What should a student check about online information?",["Whether it uses bright colours.","Whether it has many comments.","Whether it is current and evidence-based."],2,"The passage recommends checking dates and evidence."],["When is professional advice particularly important?",["When symptoms are serious.","Whenever a website is updated.","Only after reading social media."],0,"Serious or persistent symptoms require professional guidance."],["What is the writer’s overall position?",["Online sources should replace doctors.","Online sources can help when used critically.","Online sources have no educational value."],1,"The writer supports cautious, informed use."]]],["Reading 3 · How Commercials Influence Our Decisions","Beyond grade level","Infotainment","Advertisements rarely present products as isolated objects. Instead, they connect them with feelings, identities and imagined experiences. A sports drink may appear beside images of teamwork and achievement, while a learning application may be presented as the key to future success. These associations are powerful because viewers often remember an emotion more readily than a technical detail. Commercials also use repetition. A slogan heard several times can become familiar, and familiarity may be mistaken for reliability. However, recognising a brand does not mean that its claims have been independently tested. Researchers who study advertising distinguish between information that helps consumers compare choices and persuasive techniques designed mainly to attract attention. Both can appear in the same message. A commercial may accurately describe a feature while leaving out a limitation that would matter to a buyer. Visual media adds another layer of influence. Camera angles, music and editing can make ordinary situations appear exciting or urgent. A quiet background may suggest trust, while rapid cuts can create energy. None of these choices is necessarily dishonest, but they shape interpretation. Media education therefore encourages viewers to ask what is shown, what is omitted and whose interests are served. Students who examine these questions may become less likely to accept a message automatically. Yet critical thinking does not require rejecting every advertisement. Commercials can introduce useful services and explain unfamiliar products. The goal is to separate verifiable information from emotional suggestion. When consumers recognise the techniques being used, they can appreciate creative media while still making independent decisions. That distinction matters increasingly as advertising becomes integrated into entertainment and everyday digital experiences.",[["What is the writer’s central argument?",["Advertisements are always deceptive.","Consumers should distinguish evidence from persuasion.","Emotional messages are never memorable."],1,"The passage supports critical evaluation rather than total rejection."],["Why might repetition influence viewers?",["Familiarity may seem like credibility.","It proves the product is effective.","It removes the need for comparison."],0,"The writer distinguishes familiarity from tested reliability."],["What may an advertisement omit?",["All information about the product.","Every emotional appeal.","A limitation relevant to buyers."],2,"The passage mentions selective presentation."],["What does fast editing tend to create?",["A sense of energy.","A guarantee of accuracy.","An independent review."],0,"Rapid cuts are linked to energy."],["Which question best reflects media literacy?",["Is the commercial entertaining?","Whose interests does the message serve?","How many people shared it?"],1,"The text explicitly highlights interests and omissions."],["What can be inferred about visual techniques?",["They are always unethical.","They have no effect on meaning.","They can shape interpretation without lying."],2,"The writer says these choices are not necessarily dishonest."],["How are information and persuasion related?",["They can appear in the same commercial.","They never appear together.","They are identical in purpose."],0,"The passage explicitly states both may coexist."],["What is the writer’s attitude to advertising?",["Entirely hostile.","Critical but balanced.","Unquestioningly supportive."],1,"The writer recognises benefits and risks."]]],["Reading 4 · The Hidden Language of Visual Media","Beyond grade level","Infotainment","A news image may seem to record reality without interpretation, but every image is shaped by choices. Someone selects the moment, angle and frame. An editor decides which photographs appear beside a headline and which are left unseen. These decisions can influence what audiences believe is important, even when the image itself has not been altered. Consider two photographs of the same crowded public event. One shows a tightly packed group near the entrance; the other includes the surrounding empty space. Both may be accurate, yet they can create very different impressions of attendance. Captions can strengthen these impressions by directing attention toward particular details. Visual media also relies on familiar symbols. A dark background may suggest seriousness, while bright colours may communicate optimism. Such associations vary across audiences and cultures, so responsible communicators should avoid assuming that every viewer interprets an image identically. Digital platforms make these questions more urgent. Short clips are often shared without the scenes that came before or after them. A viewer may draw a confident conclusion from a fragment that does not represent the full event. Checking the source, date and wider context can prevent misunderstanding. Educators sometimes ask students to compare two versions of a story and identify differences in framing. The exercise does not prove that one version is necessarily false; rather, it reveals how selection affects meaning. Learning to read images critically is therefore similar to learning to read written arguments. Both require attention to evidence, perspective and what has been omitted. In a world where visual messages travel quickly, careful interpretation is an essential part of informed citizenship.",[["What is the main idea?",["Images always present identical meanings.","Visual choices influence interpretation.","Captions cannot affect understanding."],1,"The passage explores framing and selection."],["Why are two crowd photographs compared?",["To show how framing changes impressions.","To prove both are digitally altered.","To argue public events are unpopular."],0,"Different frames can suggest different crowd sizes."],["What role can captions play?",["They eliminate bias completely.","They replace the need for evidence.","They direct viewers’ attention."],2,"Captions guide attention to details."],["Why can short clips be misleading?",["They may omit important context.","They are always produced dishonestly.","They cannot be shared online."],0,"Missing surrounding scenes can change interpretation."],["What does “framing” refer to here?",["The physical cost of a camera.","The selection and presentation of content.","A technical fault in an image."],1,"Framing concerns what is included and how it is shown."],["What can be inferred about cultural symbols?",["They are understood universally.","They never influence meaning.","Their meanings may differ across audiences."],2,"The text says associations vary by culture."],["Why compare two versions of a story?",["To notice different editorial choices.","To prove one is automatically false.","To avoid examining evidence."],0,"Comparison reveals how selection shapes meaning."],["What connection does the writer make?",["Images are easier than written arguments.","Both images and texts require critical reading.","Only written sources require evidence."],1,"The conclusion connects visual and textual interpretation."]]]],"writing":[["Managing Teenage Stress","A Picture of Health","Should schools provide more support for students who experience stress?",["Describe common causes of teenage stress.","Explain how schools could help students manage it.","Give your opinion with reasons and examples."]],["The Importance of Health Clubs","A Picture of Health","Are health clubs necessary for a healthy lifestyle?",["Explain how health clubs may benefit young people.","Consider other ways to stay healthy.","Give your opinion with reasons and examples."]],["Healthy Habits and Student Well-being","A Picture of Health","Should healthy routines be a priority for teenagers?",["Describe healthy habits that students can develop.","Explain possible difficulties in maintaining them.","Give your opinion with reasons and examples."]],["Should Schools Help Students Manage Stress?","A Picture of Health","Should stress-management lessons be part of school life?",["Explain why students may experience stress.","Discuss how stress-management lessons could help.","Give your opinion with reasons and examples."]],["Screens Everywhere: Benefits and Drawbacks","Infotainment","Do digital screens bring more benefits than drawbacks to teenagers?",["Describe the main benefits of using screens.","Discuss possible disadvantages of screen use.","Give your opinion with reasons and examples."]],["The Effects of Excessive Screen Time","Infotainment","Should teenagers limit their daily screen time?",["Explain how excessive screen use may affect teenagers.","Suggest practical ways to manage screen time.","Give your opinion with reasons and examples."]],["Balancing Online and Offline Life","Infotainment","Is maintaining a balance between online and offline activities essential?",["Describe how teenagers use digital media.","Explain the value of offline activities.","Give your opinion with reasons and examples."]]],"sources":["Many teenagers experience stress when school assignments, examinations and family expectations compete for their attention. A small amount of pressure can encourage students to organise their time, but constant stress may affect sleep, concentration and mood. Some students keep worries to themselves because they think asking for help shows weakness. Health educators disagree. They explain that talking to a trusted adult or friend can help teenagers understand their feelings and find practical solutions. Schools can also support students by teaching time management and offering quiet spaces during busy periods. Physical activity, regular sleep and short breaks may help students feel calmer. However, these habits are not a replacement for professional support when difficulties become serious or continue for a long time. Students benefit most when they understand that stress is common and that several forms of help are available. A supportive school environment encourages young people to ask questions early rather than waiting until problems become overwhelming.","Health clubs offer organised spaces where people can exercise, learn new skills and receive guidance. For teenagers, a club may provide a safe place to practise sports after school and meet others who share similar interests. Some clubs employ trainers who explain how to exercise safely. However, membership fees and travel can make clubs difficult for some families to access. Walking, cycling and playing sports in public parks can also support fitness. Experts say that the most useful activity is often one that a person enjoys and can continue regularly. A teenager who dislikes gyms may prefer dancing or swimming with friends. Health clubs can encourage healthy routines, but they are not the only route to an active lifestyle. Schools and local communities can help by offering affordable opportunities. Choosing suitable activities matters more than following trends. People should also remember that sleep, nutrition and rest contribute to health alongside exercise.","Students sometimes believe that staying healthy requires complicated plans. In reality, many helpful habits are simple but need consistency. Regular sleep supports attention in class, while balanced meals provide energy for daily activities. Physical movement can improve fitness and offer a break from screens. Friendships and supportive conversations are also important for emotional well-being. However, schoolwork, family responsibilities and digital distractions can make routines difficult to maintain. Health educators suggest starting with small, realistic changes rather than attempting everything at once. For example, a student might set a regular bedtime or walk for a short period each afternoon. Progress is easier to maintain when goals fit everyday life. Schools can encourage healthy habits by offering clear information and opportunities for physical activity. Families can support teenagers by making time for shared meals and rest. Good health is not achieved through one perfect day; it develops through repeated choices over time.","Examinations, homework and social expectations can create pressure for teenagers. When stress becomes intense, some students struggle to concentrate or sleep. Schools increasingly discuss ways to help young people recognise these difficulties. Short lessons on time management may help students organise assignments before deadlines. Workshops can also introduce relaxation techniques and encourage students to speak to trusted adults. However, not every student experiences stress in the same way, so one strategy may not suit everyone. Teachers should avoid suggesting that simple exercises can solve every problem. Students facing serious or persistent difficulties may need support from qualified professionals. A respectful school environment makes it easier to ask for help without embarrassment. Parents and teachers can also communicate about workload and expectations. Supportive programmes work best when they combine practical skills with access to appropriate assistance. Learning to manage stress is useful not only during examinations but throughout adult life. This approach encourages realistic expectations and gives young people opportunities to make informed decisions with support from families, teachers and their wider communities.","Digital screens are part of many teenagers' daily routines. Students use them to research school topics, communicate with classmates and practise new skills. Video lessons can explain difficult ideas, while shared documents make group projects easier. Entertainment and online friendships can also be enjoyable. However, spending long periods on screens may reduce time available for sleep, exercise and face-to-face conversations. Notifications can interrupt concentration, especially when students try to complete homework. Experts therefore recommend paying attention to how and why screens are used, rather than treating all screen time as identical. Reading an educational article is different from scrolling without a clear purpose. Families can encourage balanced routines by agreeing on device-free times and supporting offline hobbies. Schools can teach digital responsibility and help students recognise persuasive online content. Screens are useful tools, but their value depends on the choices people make when using them. This approach encourages realistic expectations and gives young people opportunities to make informed decisions with support from families, teachers and their wider communities.","Many teenagers spend hours moving between messaging apps, videos and games. Digital technology can help them learn and maintain friendships, but excessive screen use may interfere with other activities. Some students continue watching short videos late at night and feel tired the next morning. Others find it difficult to focus on homework when notifications appear repeatedly. Researchers caution that the effects of screen time depend partly on the content, timing and individual habits. Simply counting hours may not explain the whole situation. Practical strategies include turning off unnecessary alerts, taking regular breaks and keeping devices away from the bed. Parents and teachers can support teenagers by discussing healthy routines rather than imposing rules without explanation. Outdoor activities, reading and conversations with friends provide useful alternatives. The aim is not to reject technology, but to use it deliberately so that schoolwork, rest and relationships receive enough attention. This approach encourages realistic expectations and gives young people opportunities to make informed decisions with support from families, teachers and their wider communities.","Online activities allow teenagers to communicate quickly, explore interests and access information from around the world. Digital tools are especially helpful when students collaborate on school assignments or practise skills independently. Nevertheless, a full day of online activity can leave little time for exercise, family conversations or creative hobbies. Some teenagers report feeling distracted when they check messages during every spare moment. A balanced routine includes opportunities to connect online as well as time away from devices. Families may agree on shared meals without phones, while students can schedule periods for homework and recreation. Schools can encourage outdoor projects and teach students to question information they encounter online. Balance does not mean spending exactly the same number of hours online and offline. It means choosing activities that support learning, health and relationships. By reflecting on their habits, teenagers can decide when technology is helpful and when stepping away is the better choice."]};
const names=['Exam Guide','Vocabulary Reference','Grammar Reference','Vocabulary Mazes','Grammar Mazes','Reading Detective','Writing Studio'];let tab=0;const app=document.getElementById('app');const nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function select(i){tab=i;document.querySelectorAll('.section').forEach((e,j)=>e.classList.toggle('active',i===j));document.querySelectorAll('nav button').forEach((e,j)=>e.classList.toggle('active',i===j));scrollTo(0,0)}
function create(){nav.innerHTML=names.map((n,i)=>`<button onclick="select(${i})">${n}</button>`).join('');app.innerHTML=names.map((n,i)=>`<section class="section" id="sec${i}"><h2>${n}</h2><div id="part${i}"></div></section>`).join('');renderGuide();renderVocab();renderGrammar();renderMazes();renderReadings();renderWriting();select(0)}
function renderGuide(){document.getElementById('part0').innerHTML=`<div class="card"><p><b>Official assessment:</b> Reading & Language 60 marks; Writing 40 marks. Total: 100 marks.</p><table><tr><th>Part</th><th>Specification</th><th>Marks</th></tr>${[['Vocabulary','160-word text (±10%), 5 gaps, A/B/C',10],['Grammar','160-word narrative (±10%), 5 gaps, A/B/C',10],['Reading 3A','Expository 270–300 words (±10%), 8 MCQs, B1.2–B2.1',24],['Reading 3B','Expository 270–300 words (±10%), 8 MCQs, B2.2',16],['Writing 1.1','170-word source, main ideas in 3–4 sentences',15],['Writing 1.2','Opinion essay, at least 170 words, exactly 3 guiding prompts',25]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table><p class="muted">Official themes: A Picture of Health; Infotainment. All exercises here are original practice material.</p></div><div class="card"><h3>How to use this preview</h3><p>Open any tab to inspect all materials. Multiple-choice exercises can be answered and scored locally. Writing responses stay in this browser session only; no data is submitted or saved to a server.</p><button class="btn" onclick="window.print()">Print preview</button></div>`}
function renderVocab(){document.getElementById('part1').innerHTML=D.vocab.map(([unit,words])=>`<div class="card"><h3>${unit}</h3>${words.map(([w,pos,def,ex],i)=>`<div class="item"><div class="word">${esc(w)} <span class="pill">${esc(pos)}</span></div><div><b>Meaning:</b> ${esc(def)}</div><div><b>Example:</b> ${esc(ex)}</div><label class="small muted">Your sentence:</label><textarea placeholder="Use ${esc(w)} in a sentence..."></textarea></div>`).join('')}</div>`).join('')+`<div class="card"><b>Grammar / Vocabulary Library connection</b><p>Links to the existing website will be mapped after checking the current library anchors. No invented or unverified deep links are included in this preview.</p></div>`}
function questionHTML(qs,id,per){return qs.map((q,i)=>`<div class="item"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="${id}_${i}" value="${j}"> ${'ABC'[j]}. ${esc(o)}</label>`).join('')}<div id="f_${id}_${i}" class="feedback hidden"></div></div>`).join('')+`<div class="controls"><button class="btn primary" onclick="grade('${id}',${per})">Submit answers</button><button class="btn" onclick="resetQuiz('${id}')">Try again</button></div><div id="score_${id}" class="result hidden"></div>`}
const quiz={};function grade(id,per){let qs=quiz[id],correct=0,complete=true;qs.forEach((q,i)=>{let chosen=document.querySelector(`input[name="${id}_${i}"]:checked`);if(!chosen)complete=false});if(!complete){alert('Please answer all questions before submitting.');return}qs.forEach((q,i)=>{let v=Number(document.querySelector(`input[name="${id}_${i}"]:checked`).value),ok=v===q[2];correct+=ok?1:0;let f=document.getElementById(`f_${id}_${i}`);f.className='feedback result'+(ok?'':' bad');f.textContent=(ok?'Correct. ':'Correct answer: '+ 'ABC'[q[2]]+'. ')+(q[3]||'Review the surrounding sentence for the correct form or meaning.')});let el=document.getElementById('score_'+id);el.className='result';el.textContent=`Score: ${correct*per}/${qs.length*per}`}
function resetQuiz(id){quiz[id].forEach((q,i)=>{document.querySelectorAll(`input[name="${id}_${i}"]`).forEach(x=>x.checked=false);document.getElementById(`f_${id}_${i}`).className='feedback hidden'});document.getElementById('score_'+id).className='result hidden'}
function renderGrammar(){document.getElementById('part2').innerHTML=D.grammar.map(([name,form,desc,ex,err,qs],i)=>{let id='g'+i;quiz[id]=qs.map(s=>{let x=s.split('|');return [x[0],x.slice(1,4),+x[4],`Rule: ${form}. Example: ${ex}`]});return `<div class="card"><h3>${i+1}. ${name}</h3><p><b>Explanation:</b> ${desc}</p><p><b>Structure:</b> <code>${esc(form)}</code></p><p><b>Unit example:</b> ${ex}</p><p><b>Common mistake:</b> ${esc(err)}</p><h4>Quick Check · 3 questions</h4>${questionHTML(quiz[id],id,1)}<p class="small muted">Existing Grammar Library link: to be connected after anchor verification.</p></div>`}).join('')}
function renderMazes(){for(let k=0;k<2;k++){document.getElementById('part'+(3+k)).innerHTML=D.mazes.slice(k*4,k*4+4).map((m,i)=>{let idx=i+k*4,id='m'+idx;quiz[id]=m[3].map((o,j)=>[`Gap ${j+1}`,o,m[4][j],`The correct expression is “${o[m[4][j]]}” in this context.`]);return `<div class="card"><h3>${m[0]}</h3><div class="small muted">${m[1]} · ${m[2].trim().split(/\s+/).length} words · 5 gaps · 10 marks</div><p class="practice passage">${esc(m[2]).replace(/\[\[(\d)\]\]/g,'<b>($1) ______</b>')}</p><h4>Choose A, B or C for each numbered gap</h4>${questionHTML(quiz[id],id,2)}</div>`}).join('')}}
function renderReadings(){document.getElementById('part5').innerHTML=D.readings.map((r,i)=>{let id='r'+i;quiz[id]=r[4].map(q=>q);return `<div class="card"><h3>${r[0]}</h3><div class="small muted">${r[1]} · ${r[2]} · ${r[3].split(/\s+/).length} words · 8 questions · ${i<2?24:16} marks</div></div><p class="muted small">Reading layout: Questions on the left · Complete passage on the right. On narrow screens, scroll horizontally to view both columns.</p><div style="overflow-x:auto"><div class="reading-grid"><div class="card"><h3>Reading Passage</h3><div class="passage">${esc(r[3])}</div></div><div class="card"><h3>Questions</h3>${questionHTML(quiz[id],id,i<2?3:2)}</div></div></div>`}).join('')}
function wc(id){let e=document.getElementById(id),n=e.value.trim()?e.value.trim().split(/\s+/).length:0;document.getElementById(id+'c').textContent=n+' words'}
function renderWriting(){document.getElementById('part6').innerHTML=`<div class="card"><h3>Writing Task 1.1 — One Worked Summary Model</h3><p><b>Step 1:</b> Read the source carefully. <b>Step 2:</b> Identify the main ideas, not every example. <b>Step 3:</b> Combine related ideas in your own words. <b>Step 4:</b> Write 3–4 clear sentences and check accuracy.</p><h4>Worked source — Managing Teenage Stress</h4><p class="passage">${esc(D.sources[0])}</p><div class="model"><b>Model summary (4 sentences):</b><p>Teenagers may experience stress because of schoolwork and other expectations, and ongoing pressure can affect their well-being. Speaking to trusted people and learning practical strategies can help them cope. Schools can provide guidance and supportive environments, while healthy routines may also reduce pressure. Students with serious or lasting difficulties may need professional assistance.</p><p class="small">Why it works: includes the central ideas, avoids minor examples, uses different wording, and stays within four sentences.</p></div></div>`+D.writing.map((w,i)=>`<div class="card"><h3>Writing Set ${i+1} — ${esc(w[0])}</h3><span class="pill">${esc(w[1])}</span>${i===0?'<p class="small muted">Part 1.1 above is the single worked model; complete Part 1.2 below.</p>':`<h4>Part 1.1 · Main Ideas · 15 marks</h4><p class="small muted">Read the source and write its main ideas in your own words in 3–4 sentences.</p><div class="practice passage">${esc(D.sources[i])}</div><p><b>Your summary:</b></p><textarea style="min-height:155px" placeholder="Write 3–4 sentences in your own words..."></textarea><p class="small muted">Checklist: main ideas · own words · no unnecessary details · 3–4 sentences. No model answer is provided for independent practice.</p>`}<h4>Part 1.2 · Opinion Essay · 25 marks</h4><p><b>${esc(w[2])}</b></p><p>In your essay:</p><ol>${w[3].map(p=>`<li>${esc(p)}</li>`).join('')}</ol><p><b>Write at least 170 words in paragraphs.</b></p><textarea id="essay${i}" style="min-height:230px" oninput="wc('essay${i}')" placeholder="Write your opinion essay here..."></textarea><div id="essay${i}c" class="count">0 words</div><p class="small muted">Self-check: clear opinion · three guiding points · paragraph organisation · reasons and examples · accurate vocabulary and grammar. Teacher assessment is needed for marks.</p></div>`).join('')}
create();</script></body></html>
